<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD866"/>
      <stop offset="0.5" stop-color="#F4B728"/>
      <stop offset="1" stop-color="#B9780B"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#2a2410"/>
      <stop offset="0.55" stop-color="#121214"/>
      <stop offset="1" stop-color="#070708"/>
    </radialGradient>
    <linearGradient id="hide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9DCE1"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-200%" width="260%" height="500%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <!-- head silhouette, symmetric around x=256 -->
    <clipPath id="headClip">
      <path id="headPath" d="M256 146 L204 160 L170 214 L178 294 L204 358 L222 416 L256 436 L290 416 L308 358 L334 294 L342 214 L308 160 Z"/>
    </clipPath>
      <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#B9580B"/>
      <stop offset="0.45" stop-color="#F4B728"/>
      <stop offset="1" stop-color="#FFF1B8"/>
    </linearGradient>
    <radialGradient id="burst" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F4B728" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F4B728" stop-opacity="0"/>
    </radialGradient>
    <filter id="bolt" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="shieldClip"><path d="M256 46 L438 151 L438 361 L256 466 L74 361 L74 151 Z"/></clipPath>
  </defs>

  <!-- shield -->
  <path d="M256 20 L460 138 L460 374 L256 492 L52 374 L52 138 Z" fill="url(#bg)" stroke="url(#gold)" stroke-width="16" stroke-linejoin="round"/>
  <path d="M256 46 L438 151 L438 361 L256 466 L74 361 L74 151 Z" fill="none" stroke="#F4B728" stroke-opacity="0.35" stroke-width="3" stroke-linejoin="round"/>

  <g clip-path="url(#shieldClip)">
    <!-- sunburst rays -->
    <g fill="#F4B728" opacity="0.09">
      <path d="M256 270 L240 40 L272 40 Z"/><path d="M256 270 L380 60 L404 80 Z"/><path d="M256 270 L450 190 L450 222 Z"/>
      <path d="M256 270 L450 330 L440 360 Z"/><path d="M256 270 L132 60 L108 80 Z"/><path d="M256 270 L62 190 L62 222 Z"/>
      <path d="M256 270 L62 330 L72 360 Z"/><path d="M256 270 L170 470 L200 476 Z"/><path d="M256 270 L342 470 L312 476 Z"/>
    </g>
    <circle cx="256" cy="268" r="180" fill="url(#burst)"/>
    <!-- circuit traces: it's a node -->
    <g stroke="#F4B728" stroke-width="3" fill="none" opacity="0.45">
      <path d="M74 300 L120 300 L140 320 L140 380"/><path d="M438 300 L392 300 L372 320 L372 380"/>
      <path d="M90 200 L130 200 L150 180"/><path d="M422 200 L382 200 L362 180"/>
    </g>
    <g fill="#F4B728" opacity="0.7">
      <circle cx="140" cy="380" r="6"/><circle cx="372" cy="380" r="6"/><circle cx="150" cy="180" r="5"/><circle cx="362" cy="180" r="5"/>
    </g>
    <!-- lightning -->
    <g filter="url(#bolt)" fill="#FFE27A">
      <path d="M118 96 L94 168 L116 166 L96 236 L146 150 L122 152 L140 96 Z"/>
      <path d="M394 96 L418 168 L396 166 L416 236 L366 150 L390 152 L372 96 Z"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <!-- ears -->
    <path d="M206 184 L132 78 L242 150 Z" fill="url(#hide)" stroke="#0b0b0b" stroke-width="4" stroke-linejoin="round"/>
    <path d="M204 170 L152 98 L228 152 Z" fill="#141414"/>
    <path d="M306 184 L380 78 L270 150 Z" fill="url(#hide)" stroke="#0b0b0b" stroke-width="4" stroke-linejoin="round"/>
    <path d="M308 170 L360 98 L284 152 Z" fill="#141414"/>

    <!-- mohawk mane -->
    <path d="M208 170 L196 112 L224 136 L222 62 L248 112 L256 30 L264 112 L290 62 L288 136 L316 112 L304 170 Z" fill="url(#flame)" stroke="#0b0b0b" stroke-width="5" stroke-linejoin="miter"/>
    <path d="M226 166 L232 112 L246 132 L256 74 L266 132 L280 112 L286 166 Z" fill="#0b0b0b" opacity="0.85"/>

    <!-- head -->
    <use href="#headPath" fill="url(#hide)"/>

    <!-- stripes, clipped to the head -->
    <g clip-path="url(#headClip)" fill="#111">
      <!-- forehead -->
      <path d="M249 148 L263 148 L260 212 L252 212 Z"/>
      <path d="M226 152 L240 150 L246 206 L238 210 Z"/>
      <path d="M286 152 L272 150 L266 206 L274 210 Z"/>
      <!-- chevrons pointing down to the centre line -->
      <path d="M150 196 L256 238 L362 196 L362 214 L256 256 L150 214 Z"/>
      <path d="M150 300 L256 330 L362 300 L362 316 L256 346 L150 316 Z"/>
      <path d="M150 340 L256 368 L362 340 L362 352 L256 380 L150 352 Z"/>
      <!-- cheek slashes -->
      <path d="M150 262 L214 286 L212 298 L150 278 Z"/>
      <path d="M362 262 L298 286 L300 298 L362 278 Z"/>
      <!-- war-paint eye band -->
      <path d="M170 248 L256 284 L342 248 L336 272 L256 300 L176 272 Z" fill="#050505"/>
    </g>

    <!-- muzzle -->
    <path d="M220 362 L256 352 L292 362 L286 414 L256 434 L226 414 Z" fill="#161616"/>
    <path d="M232 396 L246 388 L248 398 L236 404 Z" fill="#F4B728" opacity="0.85"/>
    <path d="M280 396 L266 388 L264 398 L276 404 Z" fill="#F4B728" opacity="0.85"/>

    <!-- head outline -->
    <use href="#headPath" fill="none" stroke="#0b0b0b" stroke-width="4" stroke-linejoin="round"/>
    <!-- gold rim on the jaw edges -->
    <path d="M170 214 L178 294 L204 358 L222 416 L256 436" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M342 214 L334 294 L308 358 L290 416 L256 436" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <!-- battle scar through the right eye -->
  <g clip-path="url(#headClip)">
    <path d="M296 214 L330 334" stroke="#0b0b0b" stroke-width="12" stroke-linecap="round"/>
    <path d="M296 214 L330 334" stroke="#C8321E" stroke-width="5" stroke-linecap="round"/><path d="M297 220 L327 326" stroke="#FF7A5A" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- glowing eyes -->
  <g filter="url(#glow)" fill="#FFB000">
    <path d="M192 262 L240 280 L236 290 L198 276 Z"/>
    <path d="M320 262 L272 280 L276 290 L314 276 Z"/>
  </g>
  <g fill="#FFF6D0">
    <path d="M206 269 L230 279 L228 283 L208 275 Z"/>
    <path d="M306 269 L282 279 L284 283 L304 275 Z"/>
  </g>
  <g fill="#0b0b0b" stroke="#FFD866" stroke-width="2">
    <circle cx="256" cy="20" r="6"/><circle cx="460" cy="138" r="6"/><circle cx="460" cy="374" r="6"/>
    <circle cx="256" cy="492" r="6"/><circle cx="52" cy="374" r="6"/><circle cx="52" cy="138" r="6"/>
  </g>
</svg>
